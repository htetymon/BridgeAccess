spring.application.name=bridgeaccess

# ---------------------------------------------------------------- database
# Supabase Postgres via the connection pooler (session mode).
# All values come from environment variables; never commit real secrets.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP tuned for a pooled Supabase connection.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.pool-name=BridgeAccessPool

# --------------------------------------------------------------- jpa/hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# ------------------------------------------------------------------- server
server.port=${PORT:5000}

# ---------------------------------------------------------------- actuator
# Health endpoint: /actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# ------------------------------------------------------------- compression
# Gzip JSON/text responses when the client sends Accept-Encoding: gzip.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/plain,text/html,text/css,application/javascript
server.compression.min-response-size=1KB

# ------------------------------------------------------------------ errors
# Errors use the API envelope (ApiErrorController); never leak internals.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# ------------------------------------------------------------ contributions
# POST /packages accepts up to 3 images of 500 KB (checked in CreatePackageValidator). The
# servlet limits sit above that so oversized images get the contract's IMAGE_TOO_LARGE with
# a clear message, while still capping what one request can make the server buffer.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=6MB
# Packages one device may create per UTC day (FR-5.10).
bridgeaccess.contribution.daily-limit=${DAILY_CREATE_LIMIT:5}
# ----------------------------------------------------------------- images
# Images go to the private Supabase Storage bucket when SUPABASE_URL and SUPABASE_SECRET_KEY
# are set (production); otherwise to IMAGE_STORAGE_DIR on this server (see StorageConfig).
bridgeaccess.storage.supabase-url=${SUPABASE_URL:}
bridgeaccess.storage.secret-key=${SUPABASE_SECRET_KEY:}
bridgeaccess.storage.bucket=${SUPABASE_STORAGE_BUCKET:package-images}
bridgeaccess.storage.local-dir=${IMAGE_STORAGE_DIR:./data/images}
# The AI job re-encodes each image to WebP (JPEG if WebP is unavailable) of about this size (FR-6.5).
bridgeaccess.images.target-size=${IMAGE_TARGET_SIZE:80KB}
bridgeaccess.images.max-side=${IMAGE_MAX_SIDE:1280}

# --------------------------------------------------------------- AI job
# Generation runs on a bounded pool so POST /packages returns 202 at once. Jobs beyond the
# queue wait in the database and the sweeper re-queues them (see GenerationConfig).
bridgeaccess.generation.workers=${GENERATION_WORKERS:2}
bridgeaccess.generation.queue-capacity=${GENERATION_QUEUE_CAPACITY:50}
# A claimed job still processing after this long is failed ("This took too long").
bridgeaccess.generation.timeout=${GENERATION_TIMEOUT:5m}
bridgeaccess.generation.sweep-interval=${GENERATION_SWEEP_INTERVAL:30s}
# A lesson that fails validation, or a busy/unreachable Gemini, gets one retry (FR-6.4);
# the busy case waits this long first.
bridgeaccess.generation.retry-delay=${GENERATION_RETRY_DELAY:3s}

# ------------------------------------------------------------ link reader
# Reading a contributor's link when nothing was pasted (FR-6.3). Only public http/https
# addresses are reachable (see AddressPolicy); the limits below cap time, size and redirects.
bridgeaccess.link-reader.total-timeout=${LINK_READER_TOTAL_TIMEOUT:15s}
bridgeaccess.link-reader.max-redirects=${LINK_READER_MAX_REDIRECTS:3}
bridgeaccess.link-reader.max-bytes=${LINK_READER_MAX_BYTES:2MB}

# ------------------------------------------------------------------ gemini
# Server-side only. Set GEMINI_API_KEY in the environment (never commit it). Without it the
# app still starts, but every package fails at the AI step.
bridgeaccess.gemini.api-key=${GEMINI_API_KEY:}
bridgeaccess.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
bridgeaccess.gemini.read-timeout=${GEMINI_READ_TIMEOUT:90s}
